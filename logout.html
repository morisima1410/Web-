<html>
<title>Welcome to my first website</title>
<style>
    body {
        margin: 0;
        font-family: Arial;

    }

    .main {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 50px;
        min-height: calc(100vh-110vh);
    }

    header {
        background-color: #2563eb;
        color: white;
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo img {

        height: 80px;
        border-radius:
            50%;
    }

    nav a {

        color: rgb(247, 243, 243);
        /* text-decoration: none; */
        text-decoration: none;
        margin: 15px;
    }


    .container {
        background-color: white;
        padding: 30px;
        width: 320px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgb(128, 128, 128);

    h2 {
        text-align: center;

            </form>
        </div>
