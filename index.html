<html>
<title>Welcome to my first website</title>
<style>
    body {
        margin: 0;
        font-family: Arial;

    }

    .main {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 30px;
        min-height: calc(100vh-110vh);
    }

    header {
        background-color: #2563eb;
        color: white;
        padding: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .logo img {
        width: 80px;
        height: 80px;
        border-radius: 100%;
    }

    nav a {
        color: rgb(247, 243, 243);
        text-decoration: none;
        margin: 15px;
    }


    .container {
        background-color: white;
        padding: 30px;
        width: 320px;
        border-radius: 10px;
        box-shadow: 0 0 10px gray;
    }

    h2 {
        text-align: center;
        color: #2563eb;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin-top: 10px;
    }

    button:hover {
        background-color: #2563eb;
    }
</style>

<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="logo">
        </div>
        <nav>
            <a href="#">home</a>
            <a href="#">about</a>
            <a href="#">Login</a>
            <a href="#">Registor</a>
            <a href="#">logout</a>

        </nav>
    </header>
    <div class="main">
        <div class="container">
            <div class="h2">
                <h2>Registration</h2>
            </div>
            
            <form>
                <div class="input">
                    <input type="text" placeholder="Full Name" required>
                    <input type="email" placeholder="email" required>
                    <input type="number" placeholder="Mobile Number" required>
                    <input type="password" placeholder="Password" required>
                    <button type="button">submit</button>
                </div>

            </form>
        </div>
    </div>


</body>

</html>
